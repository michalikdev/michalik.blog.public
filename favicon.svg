<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Thermal mark">
  <!--
    The site's own thermal strip, at 32 pixels: five columns climbing the iron ramp from cold
    violet to incandescent. The mark IS the idea, not a monogram standing next to it.
    Kept to plain rectangles so it stays legible at favicon size, where any detail turns to mud.
  -->
  <rect width="32" height="32" rx="4" fill="#16131f"/>
  <rect x="5"  y="20" width="3.4" height="7"  rx="1" fill="oklch(0.400 0.090 285)"/>
  <rect x="10" y="16" width="3.4" height="11" rx="1" fill="oklch(0.500 0.170 320)"/>
  <rect x="15" y="12" width="3.4" height="15" rx="1" fill="oklch(0.600 0.200 8)"/>
  <rect x="20" y="8"  width="3.4" height="19" rx="1" fill="oklch(0.750 0.180 55)"/>
  <rect x="25" y="5"  width="3.4" height="22" rx="1" fill="oklch(0.940 0.130 95)"/>
</svg>
